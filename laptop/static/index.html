<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RC Trailblazer Digital Cluster</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="ignition-off">
<main class="dash clean-layout">
  <section class="camera-frame illuminated">
    <div class="camera-bezel"></div>
    <iframe id="cameraFrame" title="RC camera" allow="autoplay; fullscreen" scrolling="no"></iframe>
    <div class="camera-glass"></div>
    <div class="camera-vignette"></div>
    <div class="camera-topline clean-camera-topline">
      <div class="live-label"><span class="rec-dot"></span>LIVE</div>
    </div>
    <div id="shiftBanner" class="shift-banner"></div>

    <div id="offOverlay" class="power-overlay show">
      <div class="boot-emblem"><span>RC</span></div>
      <div class="overlay-title">IGNITION OFF</div>
      <div class="overlay-rule"></div>
      <div class="overlay-sub">HOLD BRAKE · PRESS START</div>
    </div>

    <div id="bootOverlay" class="boot-overlay">
      <div class="boot-line"></div>
      <div class="boot-copy">SYSTEM CHECK</div>
      <div class="boot-progress"><i id="bootProgress"></i></div>
    </div>
  </section>

  <section class="cluster illuminated clean-cluster">
    <article class="vehicle-card glass-card">
      <div class="card-head"><span>STEERING</span></div>
      <div class="vehicle-stage">
        <svg viewBox="0 0 260 190" class="car-svg" aria-label="Top view vehicle">
          <defs>
            <linearGradient id="bodyMetal" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#1f3d4f"/>
              <stop offset="0.45" stop-color="#102431"/>
              <stop offset="1" stop-color="#071018"/>
            </linearGradient>
            <linearGradient id="glassGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#3b718b"/>
              <stop offset="1" stop-color="#102b3a"/>
            </linearGradient>
            <filter id="carGlow">
              <feGaussianBlur stdDeviation="2.5" result="blur"/>
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <ellipse cx="130" cy="170" rx="74" ry="10" class="car-shadow"/>
          <path d="M93 33 Q102 18 130 16 Q158 18 167 33 L176 139 Q169 163 130 169 Q91 163 84 139 Z" class="car-body"/>
          <path d="M108 37 Q130 28 152 37 L158 77 Q130 69 102 77 Z" class="car-glass"/>
          <path d="M101 94 Q130 87 159 94 L155 131 Q130 139 105 131 Z" class="car-glass rear"/>
          <path d="M96 86 H164" class="car-trim"/>
          <path d="M103 143 Q130 153 157 143" class="car-trim"/>
          <g id="frontLeftWheel" transform="rotate(0 78 60)"><rect x="69" y="39" width="18" height="43" rx="7" class="wheel"/></g>
          <g id="frontRightWheel" transform="rotate(0 182 60)"><rect x="173" y="39" width="18" height="43" rx="7" class="wheel"/></g>
          <rect x="69" y="118" width="18" height="43" rx="7" class="wheel"/>
          <rect x="173" y="118" width="18" height="43" rx="7" class="wheel"/>
          <path d="M104 22 H156" class="headlamp"/>
        </svg>
      </div>
      <div class="vehicle-readout single-readout">
        <div><small>STEER ANGLE</small><strong id="steerValue">0°</strong></div>
      </div>
    </article>

    <article class="gauge-card">
      <div class="gauge-bezel">
        <div class="gauge-face rpm-gauge exact-gauge">
          <svg class="gauge-svg" viewBox="0 0 240 240" aria-label="RPM gauge">
            <path class="gauge-base-arc" id="rpmBaseArc"></path>
            <path class="gauge-value-arc rpm-value-arc" id="rpmArc"></path>
            <path class="gauge-red-arc" id="rpmRedArc"></path>
            <g id="rpmTicks"></g>
            <g id="rpmNeedle" class="svg-needle rpm-needle">
              <path d="M120 117.8 L204 120 L120 122.2 Z"></path>
              <circle cx="120" cy="120" r="7.5"></circle>
              <circle cx="120" cy="120" r="3.2" class="needle-cap"></circle>
            </g>
          </svg>
          <div class="gauge-center">
            <small>RPM ×1000</small>
            <strong id="rpmValue">0.0</strong>
            <em id="gearValue">P</em>
          </div>
          <div class="gauge-caption">1.3 TURBO · 9AT</div>
        </div>
      </div>
    </article>

    <article class="dic glass-card clean-dic">
      <div class="pedal-row clean-pedal-row">
        <div class="pedal-meter">
          <div class="meter-head"><span>THROTTLE</span><b id="throttleValue">0%</b></div>
          <div class="meter-track"><i id="throttleBar"></i></div>
        </div>
        <div class="pedal-meter brake">
          <div class="meter-head"><span>BRAKE</span><b id="brakeValue">0%</b></div>
          <div class="meter-track"><i id="brakeBar"></i></div>
        </div>
        <div class="pedal-meter motor">
          <div class="meter-head"><span>MOTOR</span><b id="motorValue">0%</b></div>
          <div class="meter-track"><i id="motorBar"></i></div>
        </div>
      </div>

      <div class="status-grid clean-status-grid">
        <div id="warnControl" class="status-tile"><span class="status-icon">LINK</span><i></i></div>
        <div id="warnVideo" class="status-tile"><span class="status-icon">CAM</span><i></i></div>
        <div id="warnUndervolt" class="status-tile"><span class="status-icon">5V</span><i></i></div>
        <div id="warnArmed" class="status-tile"><span class="status-icon">ESC</span><i></i></div>
        <div id="warnFailsafe" class="status-tile"><span class="status-icon">SAFE</span><i></i></div>
        <div id="warnTemp" class="status-tile"><span class="status-icon">TEMP</span><i></i></div>
      </div>
    </article>

    <article class="gauge-card">
      <div class="gauge-bezel">
        <div class="gauge-face speed-gauge exact-gauge">
          <svg class="gauge-svg" viewBox="0 0 240 240" aria-label="Speed gauge">
            <path class="gauge-base-arc" id="speedBaseArc"></path>
            <path class="gauge-value-arc speed-value-arc" id="speedArc"></path>
            <g id="speedTicks"></g>
            <g id="speedNeedle" class="svg-needle speed-needle">
              <path d="M120 117.8 L204 120 L120 122.2 Z"></path>
              <circle cx="120" cy="120" r="7.5"></circle>
              <circle cx="120" cy="120" r="3.2" class="needle-cap"></circle>
            </g>
          </svg>
          <div class="gauge-center">
            <small>SPEED</small>
            <strong id="speedValue">0</strong>
            <em>km/h</em>
          </div>
          <div class="gauge-caption">ROAD SPEED</div>
        </div>
      </div>
    </article>

    <nav class="gear-stack glass-card clean-gears">
      <div class="gear-head">PRND</div>
      <button class="gear-btn active" data-gear="P"><span>P</span><small>PARK</small></button>
      <button class="gear-btn" data-gear="R"><span>R</span><small>REVERSE</small></button>
      <button class="gear-btn" data-gear="N"><span>N</span><small>NEUTRAL</small></button>
      <button class="gear-btn" data-gear="D"><span>D</span><small>DRIVE</small></button>
    </nav>
  </section>

  <footer class="footer clean-footer">
    <button id="startBtn" class="ignition-button">
      <span class="power-icon"></span>
      <b id="startMain">START</b>
      <small id="startSub">ENGINE</small>
    </button>
    <button id="estopBtn" class="estop-button"><span>EMERGENCY</span><b>STOP</b></button>
    <div class="alignment-control" aria-label="Steering alignment">
      <span>STEERING ALIGNMENT</span>
      <button id="alignmentMinus" type="button" aria-label="Decrease steering trim">−</button>
      <b id="alignmentValue">+45 µs</b>
      <button id="alignmentPlus" type="button" aria-label="Increase steering trim">+</button>
    </div>
  </footer>
</main>
<script src="/static/app.js"></script>
</body>
</html>
