server:
  host: "0.0.0.0"
  port: 8765

pca9685:
  address: 64
  i2c_bus: 1
  frequency_hz: 50

steering:
  channel: 0
  # Measured straight ahead at +25° on the old ±35° dashboard scale,
  # with the saved trim at 0: 1500 + (25/35) * (1900-1500) ≈ 1786µs.
  center_us: 1786
  # Equal travel around the calibrated center, within previously used bounds.
  left_us: 1672
  right_us: 1900
  invert: false
  max_slew_per_s: 5.5

esc:
  channel: 1
  neutral_us: 1500
  forward_creep_us: 1864
  forward_max_us: 2000
  reverse_creep_us: 1253
  reverse_max_us: 1000
  output_deadband: 0.002
  creep_command: 0.07
  startup_neutral_s: 3.0
  direction_neutral_hold_s: 0.30
  drive_slew_us_per_s: 700
  # No reverse braking: pedal controls pulse decay toward neutral (us/second).
  brake_deadband: 0.04
  brake_decay_min_us_per_s: 40
  brake_decay_max_us_per_s: 900
  brake_decay_exponent: 1.3

failsafe:
  command_timeout_s: 0.30
  center_steering: true

telemetry:
  interval_s: 0.20
