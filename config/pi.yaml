server:
  host: "0.0.0.0"
  port: 8765

pca9685:
  address: 64
  i2c_bus: 1
  frequency_hz: 50

steering:
  channel: 0
  center_us: 1500
  center_trim_us: 45
  left_us: 1100
  right_us: 1900
  invert: false
  max_slew_per_s: 5.5

esc:
  channel: 1
  neutral_us: 1500
  forward_min_us: 1540
  forward_max_us: 2000
  reverse_min_us: 1460
  reverse_max_us: 1000
  invert_direction: false
  output_deadband: 0.025
  startup_neutral_s: 3.0
  direction_neutral_hold_s: 0.30
  output_slew_per_s: 3.5
  # Braking cuts drive to neutral; no reverse PWM without wheel-speed feedback.
  brake_deadband: 0.04

failsafe:
  command_timeout_s: 0.30
  center_steering: true

telemetry:
  interval_s: 0.20
